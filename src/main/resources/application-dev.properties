# ===================================================================
# PERFIL DE DESARROLLO - H2 EN MEMORIA (sin necesidad de MySQL)
# Ejecutar con: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
# ===================================================================

spring.datasource.url=jdbc:h2:mem:ligafutbol;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
