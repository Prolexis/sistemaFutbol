# ===================================================================
# CONFIGURACIÓN DEL SISTEMA DE GESTIÓN DE LIGA DE FÚTBOL
# Spring Boot 3.3.x + Spring Data JPA + MySQL
# ===================================================================

server.port=8081

# -------------------------------------------------------------------
# CONFIGURACIÓN DE BASE DE DATOS MYSQL
# Nota para el profesor / evaluador:
# Ajuste 'spring.datasource.username' y 'spring.datasource.password'
# según sus credenciales locales de MySQL / MySQL Workbench / XAMPP.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/bd_encuentrosdeportivos?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# CONFIGURACIÓN JPA / HIBERNATE
# 'update': actualiza el esquema sin borrar datos de prueba
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# CONFIGURACIÓN DE FORMATEO JSON (Jackson)
# -------------------------------------------------------------------
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# -------------------------------------------------------------------
# CONFIGURACIÓN DE RECURSOS ESTÁTICOS (FRONTEND EN /static)
# Permite servir index.html directamente en http://localhost:8081/
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
